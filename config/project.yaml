# Copy to project.yaml and edit. Read by the pipeline (cli.py) from phase 2 onward.
comfyui:
  url: http://127.0.0.1:8188
  autostart: true      # start ComfyUI (scripts/start_comfyui.ps1) when it isn't running
  autostop: true       # stop it again afterwards, but only if we started it; false = leave it running

input:
  video: my video new.MOV   # relative to the project root; CLI argument overrides it
  start: 0             # seconds into the clip; --start overrides
  seconds: null        # length to process (omit or null = to the end); --seconds overrides
  shot: full_D         # name of this run's folders and output video; --shot overrides.
                       # full_A = ControlNet 0.8; full_D = ControlNet 1.0 (face follows the source exactly).
                       # Same name + same settings = frames are reused. Same name + different settings =
                       # the run stops and nothing is overwritten, so pick a new name for each experiment.
                       # Omit it to use the video's file name (plus _preview for `preview`).

models:
  checkpoint: Counterfeit-V3.0_fix_fp16.safetensors
  controlnet_lineart: control_v11p_sd15s2_lineart_anime_fp16.safetensors

style:
  positive: "masterpiece, best quality, anime style, cel shading, clean lineart, vibrant colors, black hair, red eyes"
  negative: "lowres, bad anatomy, bad hands, blurry, worst quality, jpeg artifacts, watermark, realistic, photo"
  loras:               # phase 4: LoRAs from training/output/, applied in this order. Empty list = plain checkpoint.
    - {name: bloodlust_style.safetensors, weight: 0.6, trigger: bloodlust_style, negative: "scar, blood, smoke, purple hair, maroon hair, brown hair, colored hair"}
  # The actor LoRA is off: it pulled the face back to photographic (docs/phase4-results.md). To try it again, add
  #   - {name: adwait_person-000004.safetensors, weight: 0.25, trigger: adwait_person, negative: "beanie, headband, hat"}
  #   Files are copied into ComfyUI's models/loras automatically. Changing this list counts as a changed setting (use a new shot name).

sampling:
  seed: 12345          # fixed per shot; the same seed on every frame limits flicker
  steps: 24
  cfg: 7.0
  sampler: euler_ancestral
  scheduler: normal
  denoise: 0.6         # setting "A" for the selfie clip with the style LoRA (the example file's default is 0.4)

controlnet:
  lineart_strength: 1.0   # full_D: the face follows the source lineart as closely as possible (full_A used 0.8; 0.6 gave a sharp anime jaw)

animatediff:           # phase 3 cloud stage (cli.py animatediff): the whole shot in one AnimateDiff pass; needs ~16 GB GPU
  motion_model: v3_sd15_mm.ckpt
  context_length: 16   # frames per AnimateDiff window; windows overlap so the seams blend
  context_overlap: 4
  timeout_seconds: 3600
  ip_adapter:
    enabled: false     # off by default: on dance_run1 AnimateDiff alone was as steady and kept the source's colors
                       # better (docs/phase3-guide.md section 5). true = add IP-Adapter (needs a reference image); use a new shot name
    weight: 0.5        # how strongly the reference's colors and look are applied
    reference: samples/dance/ip_reference.png   # relative to the project root; frame 28 of the dance_run1 anime output

temporal:              # phase 3 flow-warp deflicker (cli.py deflicker); CPU only
  strength: 0.9        # weight of the motion-warped previous frame where the flow is trusted (0 = off)
  lowpass_sigma: 8     # blend only colors/tones coarser than this many pixels, keeping the fresh frame's edges (0 = blend all).
                       # 2 (the example's value) also drags the face's cel shading along the optical flow, and because each
                       # output feeds the next the error builds up and slides around the face. 8 blends only overall tone.
  error_threshold: 25  # source color error (0-255) above which the warp is ignored (occlusions, fast motion)

video:
  work_fps: 12         # stylize "on twos"; the output is encoded at this rate
  target_megapixels: 0.4   # about 864x488 for a 16:9 clip; safe on a 6 GB GPU

training:              # phase 4 (LoRA training); see training/README.md
  style:
    # video: training/input/bloodlust.mkv   # the film; omit to use the largest video file in training/input/
    max_images: 250      # frames kept (spread evenly over the film)
    crop_bottom_pct: 0   # raise (e.g. 12) if the film has burned-in subtitles
    trigger: bloodlust_style   # first word of every caption; put it in the prompt to use the LoRA
    steps: 2500          # total training steps (about 33 min on the RTX 2060)
    # run: v2            # set a new name to train again with other settings (the old LoRA is never overwritten)
  actors:
    crops: true          # also cut face and upper-body crops from each photo (nothing is replaced)
    # Adwait:            # per actor, by folder name in training/data/actors/
    #   trigger: adwait_person
    #   steps: 2400
    #   run: v2
  lora:                  # training/train.py; tuned for 6 GB (512 px, batch 1, AdamW8bit, gradient checkpointing)
    network_dim: 32
    network_alpha: 16
    learning_rate: 0.0001
    text_encoder_lr: 0.00005
    epochs: 10
